<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AG Project & Idea Matrix</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- HEADER & STATS BAR (EXTREME EFFICIENCY) -->
  <header class="app-header">
    <div class="brand-group">
      <div class="logo-icon">🚀</div>
      <div class="brand-text">
        <h1>AG Project & Idea Matrix</h1>
        <span class="subtext">d:\__G AG Projects &bull; D:\AI_Second_Brain</span>
      </div>
    </div>

    <!-- STAGE STATS PILLS (INTERACTIVE FILTERS) -->
    <div class="stats-bar" id="statsBar">
      <!-- Generated dynamically -->
    </div>

    <div class="header-actions">
      <button class="btn btn-secondary btn-sm" id="btnRescan" title="Quét thêm các thư mục mới trong d:\__G AG Projects">
        🔄 Quét Dự Án AG
      </button>
      <div class="sync-pill" title="Tự động đồng bộ với Second Brain">
        <span class="sync-dot"></span> Synced Second Brain
      </div>
    </div>
  </header>

  <!-- CONTROL & FILTER BAR -->
  <section class="control-bar">
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Tìm kiếm nhanh dự án, tag, ý tưởng... (gõ là lọc)" autocomplete="off">
      <button id="btnClearSearch" class="btn-icon hidden" title="Xóa tìm kiếm">✕</button>
    </div>

    <div class="filter-group">
      <label>Category:</label>
      <select id="categoryFilter">
        <option value="ALL">Tất cả danh mục (All)</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Stage:</label>
      <select id="stageFilter">
        <option value="ALL">Tất cả giai đoạn (All)</option>
        <option value="Idea / Conceptual">🟣 Idea / Conceptual</option>
        <option value="Just Started / Inception">🔵 Just Started / Inception</option>
        <option value="In Progress - Expanding">🟠 In Progress - Expanding</option>
        <option value="Near Complete - Polishing">🟡 Near Complete - Polishing</option>
        <option value="Ready for Promotion / Launch">🟢 Ready for Promotion / Launch</option>
      </select>
    </div>

    <div class="filter-group">
      <label>Idea Status:</label>
      <select id="ideaStatusFilter">
        <option value="ALL">Tất cả ý tưởng</option>
        <option value="Chưa triển khai">⚪ Chưa triển khai</option>
        <option value="Đang triển khai">🟡 Đang triển khai</option>
        <option value="Đã xong">🟢 Đã xong</option>
        <option value="Loại bỏ">🔴 Loại bỏ</option>
      </select>
    </div>

    <button class="btn btn-primary btn-sm" id="btnToggleAddProject">
      + Thêm Dự Án Mới
    </button>
  </section>

  <!-- INLINE QUICK ADD PROJECT (COLLAPSIBLE / FAST INPUT) -->
  <section class="quick-add-section hidden" id="quickAddSection">
    <form id="addProjectForm" class="quick-add-form">
      <div class="form-row">
        <div class="form-field cat-field">
          <label>Category:</label>
          <div class="cat-input-group">
            <select id="newProjCategory"></select>
            <button type="button" id="btnAddNewCat" class="btn-icon" title="Thêm category mới">+</button>
          </div>
        </div>

        <div class="form-field name-field">
          <label>Tên dự án (*):</label>
          <input type="text" id="newProjName" placeholder="VD: AnyMacroPad, AI Video Generator..." required>
        </div>

        <div class="form-field stage-field">
          <label>Giai đoạn:</label>
          <select id="newProjStage">
            <option value="Idea / Conceptual">🟣 Idea / Conceptual (Ý tưởng)</option>
            <option value="Just Started / Inception">🔵 Just Started / Inception (Mới bắt đầu)</option>
            <option value="In Progress - Expanding" selected>🟠 In Progress - Expanding (Đang làm nhiều)</option>
            <option value="Near Complete - Polishing">🟡 Near Complete - Polishing (Gần hoàn chỉnh)</option>
            <option value="Ready for Promotion / Launch">🟢 Ready for Promotion / Launch (Sẵn sàng quảng bá)</option>
          </select>
        </div>

        <div class="form-field tags-field">
          <label>Tags (#tag1, #tag2):</label>
          <input type="text" id="newProjTags" placeholder="#Rust, #Tauri, #AI">
        </div>

        <div class="form-field idea-field">
          <label>Ý tưởng / Todo ban đầu:</label>
          <input type="text" id="newProjInitialIdea" placeholder="Ý tưởng cốt lõi cần làm đầu tiên...">
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Lưu Dự Án (Enter)</button>
          <button type="button" class="btn btn-secondary" id="btnCancelAddProj">Hủy</button>
        </div>
      </div>
    </form>
  </section>

  <!-- 4-COLUMN HIGH DENSITY MASTER MATRIX -->
  <main class="matrix-container">
    <table class="matrix-table" id="matrixTable">
      <thead>
        <tr>
          <th style="width: 14%;">CỘT 1: CATEGORY</th>
          <th style="width: 25%;">CỘT 2: TÊN DỰ ÁN &amp; GIAI ĐOẠN</th>
          <th style="width: 16%;">CỘT 3: TAGS PHÂN LOẠI</th>
          <th style="width: 45%;">CỘT 4: CÁC Ý TƯỞNG &amp; TRẠNG THÁI</th>
        </tr>
      </thead>
      <tbody id="matrixBody">
        <!-- Rows rendered dynamically -->
      </tbody>
    </table>

    <div id="emptyState" class="empty-state hidden">
      <div class="empty-icon">📂</div>
      <h3>Không tìm thấy dự án phù hợp với bộ lọc</h3>
      <p>Hãy thử xóa bớt từ khóa tìm kiếm hoặc chọn "Tất cả" trong bộ lọc.</p>
    </div>
  </main>

  <!-- TOAST NOTIFICATION -->
  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
